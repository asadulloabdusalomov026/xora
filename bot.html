<script>
/* ========= SOZLAMALAR (GitHub'da o'zgartiring) ========= */
const DEFAULT_CFG={
  name:'YUMMI TANGA', adminPass:'admin123', adminIds:[],   // adminIds: Telegram ID lar ro'yxati, masalan [123456789]
  coinsPerUzs:150, minWithdraw:150000, minDeposit:10000,
  payCard:'0000 0000 0000 0000', payOwner:'Karta egasi',
  wheelCost:5000, dailyBase:100, refillHours:24, diaToCoin:50, coinToDia:100, announce:'', maintenance:false, inviteReward:50, subReward:5, taskMinDia:300, appLink:'', channelUrl:'https://t.me/telegram'
};
const DEFAULT_SKINS=[
 {id:1,name:'Oddiy tanga',e:'🪙',price:0,click:1,energy:200},
 {id:2,name:'Kumush',e:'🥈',price:500,click:2,energy:400},
 {id:3,name:'Bronza',e:'🥉',price:650,click:3,energy:600},
 {id:4,name:'Oltin',e:'🥇',price:1000,click:5,energy:1000},
 {id:5,name:'Olov',e:'🔥',price:1400,click:6,energy:1400},
 {id:6,name:'Shoh',e:'👑',price:3000,click:7,energy:1600}];
const DEFAULT_TASKS=[{id:1,title:'Telegram kanalga obuna bo\'ling',reward:5,url:'https://t.me/telegram',on:true}];
const DEFAULT_WHEEL=[{v:40,w:18},{v:45,w:16},{v:55,w:14},{v:60,w:12},{v:65,w:10},{v:70,w:9},{v:75,w:8},{v:95,w:5},{v:1000,w:1}];
const DEFAULT_SERVICES=[
 {id:1,net:'ig',title:'Instagram Prasmotr',sub:"Sifatli ko'rishlar",price:3,min:500,on:true},
 {id:2,net:'ig',title:"Instagram Jo'natishlar",sub:'Haqiqiy ulashishlar',price:2,min:500,on:true},
 {id:3,net:'ig',title:'Instagram Obunachi',sub:'Tez va sifatli obunachilar',price:10,min:500,on:true},
 {id:4,net:'ig',title:'Instagram Like',sub:'Tez va sifatli like',price:5,min:500,on:true},
 {id:5,net:'tg',title:'Telegram Prasmotr',sub:"Tezkor ko'rishlar",price:3,min:500,on:true},
 {id:6,net:'tg',title:'Telegram Reaksiya',sub:'Jonli reaksiyalar',price:2,min:500,on:true},
 {id:7,net:'tg',title:'TG OBUNACHILAR',sub:'Telegram',price:10,min:500,on:true}];
const COLORS=['#e8738a','#e89a4d','#dcb73a','#3dba72','#2bb0a8','#4a80d8','#8f72e0','#d77fc4','#e86a6a'];

/* ========= MA'LUMOTLAR (localStorage; haqiqiy loyihada backend kerak) ========= */
const KEY='yt_db_v1';
let DB;
function load(){try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  DB=DB||{};DB.cfg=Object.assign({},DEFAULT_CFG,DB.cfg||{});
  DB.skins=DB.skins||DEFAULT_SKINS;DB.tasks=DB.tasks||DEFAULT_TASKS;DB.wheel=DB.wheel||DEFAULT_WHEEL;
  DB.codes=DB.codes||[];DB.transfers=DB.transfers||[];DB.services=DB.services||DEFAULT_SERVICES;DB.orders=DB.orders||[];DB.users=DB.users||{};DB.rel=DB.rel||[];DB.auctions=DB.auctions||[{id:1,icon:'⭐',title:'Premium obuna (1 oy)',seller:'@admin',start:150,step:10,end:Date.now()+4*36e5,prizeDia:0,prizeText:'Telegram Premium 1 oy',bid:0,bidder:'',bidderName:'',bids:[],done:false}];DB.reqs=DB.reqs||[];DB.log=DB.log||[];}
function save(){localStorage.setItem(KEY,JSON.stringify(DB))}
load();
const tg=window.Telegram&&Telegram.WebApp;if(tg){try{tg.ready();tg.expand()}catch(e){}}
const tu=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
let UID=tu?String(tu.id):(localStorage.yt_uid||(localStorage.yt_uid='u'+Math.random().toString(36).slice(2,8)));
const UNAME=tu?(tu.username?'@'+tu.username:tu.first_name):'Mehmon';
if(!DB.users[UID]){DB.users[UID]={id:UID,name:UNAME,coins:0,dia:7,uzs:0,skin:1,owned:[1],energy:200,last:Date.now(),done:[],daily:0,streak:0,ban:false,taps:0,joined:Date.now(),music:true,lang:'uz',code:mkCode()};const rf=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||new URLSearchParams(location.search).get('ref');if(rf&&rf!=UID&&DB.users[rf]){DB.users[rf].dia+=DB.cfg.inviteReward;DB.users[UID].ref=rf;log('Taklif: '+rf+' +'+DB.cfg.inviteReward)}save()}
const U=()=>DB.users[UID];
if(!U().code){U().code=mkCode();save()}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.floor(n).toLocaleString('ru-RU');
const skin=()=>DB.skins.find(s=>s.id==U().skin)||DB.skins[0];
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function log(t){DB.log.unshift({t:Date.now(),m:t});DB.log=DB.log.slice(0,100)}
function regen(){const u=U(),s=skin(),now=Date.now();

function music(){clearInterval(mt);mt=0;if(!U().music)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();const sc=[262,294,330,392,440,523];
  mt=setInterval(()=>{const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type='sine';o.frequency.value=sc[Math.floor(Math.random()*sc.length)];g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.05,n+.1);g.gain.linearRampToValueAtTime(0,n+1.4);o.connect(g);g.connect(ac.destination);o.start();o.stop(n+1.5)},700)}catch(e){}}

function endA(id){DB.auctions.find(x=>x.id==id).end=Date.now();settle();admin()}
function delA(id){const a=DB.auctions.find(x=>x.id==id);if(!confirm('O\'chirilsinmi?'))return;if(!a.done&&a.bidder&&DB.users[a.bidder])DB.users[a.bidder].coins+=a.bid;DB.auctions=DB.auctions.filter(x=>x.id!=id);save();admin()}
function aRel(){return `<div class="card"><label>Nomi</label><input id="r1"><label>Havola</label><input id="r2" placeholder="https://"><button style="width:100%" onclick="addRel()">Qo'shish</button></div>`+DB.rel.map(r=>`<div class="card row sp"><div class="g"><b>${esc(r.title)}</b><br><small>${esc(r.url)}</small></div><button class="rd" onclick="DB.rel=DB.rel.filter(x=>x.id!=${r.id});save();admin()">🗑</button></div>`).join('')}
function addRel(){const t=$('#r1').value.trim();if(!t)return toast('Nom kiriting');DB.rel.push({id:Date.now(),title:t,url:$('#r2').value.trim()});save();admin()}
function aStats(){const us=Object.values(DB.users),pend=DB.reqs.filter(r=>r.st=='pending').length,
  sum=t=>DB.reqs.filter(r=>r.type==t&&r.st=='ok').reduce((s,r)=>s+r.amt,0);
  return `<div class="grid">`+[['Foydalanuvchilar',us.length],['Kutilayotgan so\'rovlar',pend],['Jami tanga',fmt(us.reduce((s,u)=>s+u.coins,0))],['Jami olmos',fmt(us.reduce((s,u)=>s+u.dia,0))],
  ['Tasdiqlangan kirim',fmt(sum('in'))+' UZS'],['Tasdiqlangan chiqim',fmt(sum('out'))+' UZS'],['Foydalanuvchi UZS qarzi',fmt(us.reduce((s,u)=>s+u.uzs,0))+' UZS'],['Bloklanganlar',us.filter(u=>u.ban).length]]
  .map(x=>`<div class="card"><div style="color:var(--mut);font-size:12px">${x[0]}</div><b style="font-size:18px">${x[1]}</b></div>`).join('')+`</div>
  <div class="card"><b>Oxirgi harakatlar</b>`+DB.log.slice(0,12).map(l=>`<div style="font-size:12px;color:var(--mut)">${new Date(l.t).toLocaleString()} — ${esc(l.m)}</div>`).join('')+`</div>`}
function aReqs(){const rs=DB.reqs.slice().reverse();return `<div style="overflow:auto"><table><tr><th>Kim</th><th>Tur</th><th>Summa</th><th>Karta</th><th></th></tr>`+rs.map(r=>`<tr><td>${esc(r.uname)}</td><td>${r.type=='in'?'Kirim':'Chiqim'}</td><td>${fmt(r.amt)}</td><td>${r.card}</td>
  <td>${r.st=='pending'?`<button class="gr" onclick="resolve(${r.id},1)">✔</button> <button class="rd" onclick="resolve(${r.id},0)">✖</button>`:`<span class="tag ${r.st}">${r.st=='ok'?'OK':'Rad'}</span>`}</td></tr>`).join('')+`</table></div>`+(rs.length?'':'Hali so\'rov yo\'q')}
function resolve(id,ok){const r=DB.reqs.find(x=>x.id==id),u=DB.users[r.uid];r.st=ok?'ok':'no';
  if(ok&&r.type=='in')u.uzs+=r.amt;if(!ok&&r.type=='out')u.uzs+=r.amt;log('Admin '+(ok?'tasdiqladi':'rad etdi')+': '+r.uname+' '+r.amt);save();admin()}
function aUsers(){return `<input id="q" placeholder="Qidirish (ism/ID)" oninput="admin2()"><div id="ul"></div>`+(setTimeout(admin2),'')}
function admin2(){const q=($('#q')?.value||'').toLowerCase();$('#ul').innerHTML=`<div style="overflow:auto"><table><tr><th>Foydalanuvchi</th><th>🪙</th><th>💎</th><th>UZS</th><th></th></tr>`+
  Object.values(DB.users).filter(u=>(u.name+u.id).toLowerCase().includes(q)).map(u=>`<tr><td>${esc(u.name)}<br><small>${u.id}</small></td><td>${fmt(u.coins)}</td><td>${fmt(u.dia)}</td><td>${u.uzs.toFixed(0)}</td>
  <td><button class="o" onclick="editU('${u.id}')">✏️</button> <button class="${u.ban?'gr':'rd'}" onclick="ban('${u.id}')">${u.ban?'Ochish':'Ban'}</button></td></tr>`).join('')+'</table></div>'}
function editU(id){const u=DB.users[id];sheet(`<h3>${esc(u.name)}</h3><label>Tanga</label><input id="e1" type="number" value="${u.coins}"><label>Olmos</label><input id="e2" type="number" value="${u.dia}"><label>UZS</label><input id="e3" type="number" value="${u.uzs}">
  <button style="width:100%" onclick="saveU('${id}')">Saqlash</button><br><br><button class="rd" style="width:100%" onclick="delU('${id}')">Foydalanuvchini o'chirish</button>`)}
function saveU(id){const u=DB.users[id];u.coins=+$('#e1').value;u.dia=+$('#e2').value;u.uzs=+$('#e3').value;log('Admin '+u.name+' balansini o\'zgartirdi');save();closeS();admin()}
function delU(id){if(confirm('O\'chirilsinmi?')){delete DB.users[id];save();closeS();admin()}}
function ban(id){DB.users[id].ban=!DB.users[id].ban;save();admin()}
function aTasks(){return `<button onclick="editT()">➕ Yangi vazifa</button><br><br>`+DB.tasks.map(t=>`<div class="card row sp"><div class="g"><b>${esc(t.title)}</b><br><small>+${t.reward}💎 · ${t.on?'faol':'o\'chiq'}${t.owner?' · foydalanuvchi: '+(t.got||[]).length+'/'+t.quota:''}</small></div><button class="o" onclick="editT(${t.id})">✏️</button><button class="rd" onclick="delT(${t.id})">🗑</button></div>`).join('')}
function editT(id){const t=DB.tasks.find(x=>x.id==id)||{title:'',reward:5,url:'',on:true};sheet(`<h3>Vazifa</h3><label>Nomi</label><input id="t1" value="${esc(t.title)}"><label>Mukofot (💎)</label><input id="t2" type="number" value="${t.reward}"><label>Havola</label><input id="t3" value="${esc(t.url)}">
  <label>Holati</label><select id="t4"><option value="1" ${t.on?'selected':''}>Faol</option><option value="0" ${t.on?'':'selected'}>O'chiq</option></select><button style="width:100%" onclick="saveT(${id||0})">Saqlash</button>`)}
function saveT(id){const o={title:$('#t1').value,reward:+$('#t2').value,url:$('#t3').value,on:$('#t4').value=='1'};if(id)Object.assign(DB.tasks.find(x=>x.id==id),o);else DB.tasks.push({id:Date.now(),...o});save();closeS();admin()}
function delT(id){DB.tasks=DB.tasks.filter(t=>t.id!=id);save();admin()}
function aSkins(){return `<button onclick="editS()">➕ Yangi tanga</button><br><br>`+DB.skins.map(s=>`<div class="card row sp"><span style="font-size:30px">${s.e}</span><div class="g"><b>${esc(s.name)}</b><br><small>💎${s.price} · x${s.click} · ⚡${s.energy}</small></div><button class="o" onclick="editS(${s.id})">✏️</button><button class="rd" onclick="delS(${s.id})">🗑</button></div>`).join('')}
function editS(id){const s=DB.skins.find(x=>x.id==id)||{e:'🪙',name:'',price:100,click:1,energy:200};sheet(`<h3>Tanga</h3><label>Emoji</label><input id="s1" value="${s.e}"><label>Nomi</label><input id="s2" value="${esc(s.name)}"><label>Narx (💎)</label><input id="s3" type="number" value="${s.price}">
  <label>Bosish kuchi</label><input id="s4" type="number" value="${s.click}"><label>Maks energiya</label><input id="s5" type="number" value="${s.energy}"><button style="width:100%" onclick="saveS(${id||0})">Saqlash</button>`)}
function saveS(id){const o={e:$('#s1').value,name:$('#s2').value,price:+$('#s3').value,click:+$('#s4').value,energy:+$('#s5').value};if(id)Object.assign(DB.skins.find(x=>x.id==id),o);else DB.skins.push({id:Date.now(),...o});save();closeS();admin()}
function delS(id){if(id==1)return toast('Asosiy tangani o\'chirib bo\'lmaydi');DB.skins=DB.skins.filter(s=>s.id!=id);Object.values(DB.users).forEach(u=>{u.owned=u.owned.filter(x=>x!=id);if(u.skin==id)u.skin=1});save();admin()}
function aWheel(){const tot=DB.wheel.reduce((s,p)=>s+p.w,0);return `<div class="card"><label>Aylanish narxi (🪙)</label><input id="wc" type="number" value="${DB.cfg.wheelCost}"></div>
  <div class="card"><b>Sovrinlar va ehtimollik og'irligi</b><br><small style="color:var(--mut)">Foydalanuvchilarga ehtimollarni oshkor qiling.</small>`+DB.wheel.map((p,i)=>`<div class="row" style="margin-top:6px"><input style="margin:0" type="number" value="${p.v}" onchange="DB.wheel[${i}].v=+this.value"><input style="margin:0" type="number" value="${p.w}" onchange="DB.wheel[${i}].w=+this.value"><span style="width:60px;font-size:12px">${(p.w/tot*100).toFixed(1)}%</span><button class="rd" onclick="DB.wheel.splice(${i},1);admin()">🗑</button></div>`).join('')+`</div>
  <div class="row"><button class="o g" onclick="DB.wheel.push({v:50,w:5});admin()">➕ Sovrin</button><button class="g" onclick="DB.cfg.wheelCost=+$('#wc').value;save();toast('Saqlandi');admin()">Saqlash</button></div>`}
function aCfg(){const c=DB.cfg;const f=(k,l,t='text')=>`<label>${l}</label><input id="c_${k}" type="${t}" value="${esc(c[k])}">`;
  return `<div class="card">${f('name','Ilova nomi')}${f('coinsPerUzs','Necha tanga = 1 UZS','number')}${f('minWithdraw','Minimal yechish (UZS)','number')}${f('minDeposit','Minimal kiritish (UZS)','number')}${f('diaToCoin','1 💎 = necha 🪙','number')}${f('coinToDia','Necha 🪙 = 1 💎','number')}${f('inviteReward','Taklif mukofoti (💎)','number')}${f('subReward','Obunachi uchun mukofot (💎)','number')}${f('taskMinDia','Vazifa uchun minimal olmos','number')}${f('channelUrl','Rasmiy kanal havolasi')}${f('appLink','Mini App havolasi (https://t.me/bot/app)')}${f('dailyBase','Kunlik bonus bazasi (🪙)','number')}${f('refillHours','Energiya to\'lish vaqti (soat)','number')}
  ${f('payCard','To\'lov kartasi')}${f('payOwner','Karta egasi')}<label>Admin Telegram ID lari (vergul bilan)</label><input id="c_ids" value="${c.adminIds.join(',')}">${f('adminPass','Admin parol')}
  <label>E'lon (bosh sahifada ko'rinadi)</label><textarea id="c_announce" rows="2">${esc(c.announce)}</textarea>
  <label>Profilaktika rejimi</label><select id="c_mt"><option value="0" ${c.maintenance?'':'selected'}>O'chiq</option><option value="1" ${c.maintenance?'selected':''}>Yoqilgan</option></select></div><button style="width:100%" onclick="saveCfg()">Saqlash</button>`}
function saveCfg(){const c=DB.cfg,g=k=>$('#c_'+k).value;['name','payCard','payOwner','adminPass','announce','appLink','channelUrl'].forEach(k=>c[k]=g(k));
  ['coinsPerUzs','minWithdraw','minDeposit','dailyBase','refillHours','diaToCoin','coinToDia','inviteReward','subReward','taskMinDia'].forEach(k=>c[k]=+g(k));c.adminIds=g('ids').split(',').map(s=>s.trim()).filter(Boolean);c.maintenance=g('mt')=='1';save();toast('Saqlandi ✅')}
function aData(){return `<div class="card"><p>Zaxira nusxa (JSON) oling yoki tiklang.</p><button onclick="exp()">⬇️ Eksport</button> <button class="o" onclick="$('#imp').click()">⬆️ Import</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this)">
  <br><br><button class="rd" onclick="if(confirm('Barcha ma\\'lumot o\\'chadi!')){localStorage.removeItem(KEY);location.reload()}">Hammasini tozalash</button></div>
  <div class="card" style="color:var(--mut);font-size:13px">Eslatma: ma'lumotlar brauzerning localStorage'ida saqlanadi. Haqiqiy foydalanuvchilar uchun server (Firebase / Supabase / o'z API'ngiz) va Telegram initData tekshiruvi kerak.</div>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}));a.download='yummi-backup.json';a.click()}
function imp(i){const r=new FileReader();r.onload=()=>{try{DB=JSON.parse(r.result);save();location.reload()}catch(e){toast('Fayl noto\'g\'ri')}};r.readAsText(i.files[0])}

regen();render();

/* ========= YUKLANISH EKRANI: 3 soniyada 0 → 100% ========= */
(function(){
  const SPLASH_MS=3000,n=DB.cfg.name.replace(/\s+/g,''),k=Math.ceil(n.length/2);
  $('#st').innerHTML=esc(n.slice(0,k))+'<b>'+esc(n.slice(k))+'</b>';
  const t0=Date.now();
  (function f(){
    const r=Math.min(1,(Date.now()-t0)/SPLASH_MS),p=Math.round(r*100);
    $('#sb').style.width=p+'%';$('#sp').textContent=p+'%';$('#sr').style.strokeDashoffset=628.3*(1-r);
    if(r<1)requestAnimationFrame(f);
    else setTimeout(()=>{const s=$('#splash');s.style.opacity=0;setTimeout(()=>s.remove(),500)},200);
  })();
})();
</script>
</body>
